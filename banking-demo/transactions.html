<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transactions - SecureBank</title>
<link rel="stylesheet" href="assets/bank.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/bank.js"></script>
<div class="page">
  <h1>Transactions</h1>
  <p class="sub" id="acct-line"></p>

  <div class="card">
    <table>
      <thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody id="txn-rows"></tbody>
    </table>
  </div>

  <div class="actions">
    <button type="button" onclick="location.href='transfer.html'">Transfer Money</button>
    <button type="button" class="ghost" onclick="location.href='dashboard.html'">Back to dashboard</button>
  </div>
</div>

<script>
  BankApp.requireLogin();
  BankApp.mountChrome("Transactions");
  const d = BankApp.data;
  document.getElementById("acct-line").innerHTML =
    'Account <span data-field="accountNumber">' + d.accountNumber + '</span> - last 30 days';
  document.getElementById("txn-rows").innerHTML = d.transactions.map(t => `
    <tr>
      <td>${t.date}</td>
      <td>${t.description}</td>
      <td class="amount ${t.amount < 0 ? "debit" : "credit"}" data-field="amount">${BankApp.money(t.amount)}</td>
    </tr>`).join("");
</script>
</body>
</html>
